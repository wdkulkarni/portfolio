<!DOCTYPE html>

<html>
    <head>
        <title>Run!</title>
        <style>
            canvas {
                border: 1px solid #000000;
                background-color: #ffffff;
            }
        </style>
    </head>
    <body onload = "startGame()">
        <script>
            var obstacles = [];
            function startGame() {
                screen.start();
                player = new component(25, 50, "https://lh3.googleusercontent.com/5YqqKa3wqS4JjhVHtnndMb1bNzOqUysKZQrC-BR3AfSnOsn3eB5ERupPXRv25efdKpG_Gp9wl9wiZCoFZoVrQ6c-gT_No-x6MEnvghwY0wSXtf2ZttNd711ed6bzqjegN0JYpnoz-UIrm8JrUGalww", 0, screen.canvas.height - 44, "image");
                score = new component("20px", "Times", "black", 5, 20, "text");
                random = Math.floor(Math.random() * (500 - 30) + 30)
            }
            var screen = {
                canvas : document.createElement("canvas"),
                start : function() {
                    this.canvas.width = 500;
                    this.canvas.height = 200;
                    this.context = this.canvas.getContext("2d");
                    document.body.insertBefore(this.canvas, document.body.childNodes[0]);
                    this.interval = setInterval(updateScreen, 20);
                    this.frameno = 0;
                    window.addEventListener('keydown', function (e) {
                        screen.keys = (screen.keys || []);
                        screen.keys[e.keyCode] = true;
                    })
                    window.addEventListener('keyup', function (e) {
                        screen.keys[e.keyCode] = false;
                    })
                },
                clear : function() {
                    this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
                }
            }
            function component(width, height, color, x, y, type) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type;
                if (type == "image") {
                    this.image = new Image();
                    this.image.src = color;
                }
                this.update = function() {
                    ctx = screen.context;
                    if (this.type == "text") {
                        ctx.font = this.width + " " + this.height;
                        ctx.fillStyle = color;
                        ctx.fillText(this.text, this.x, this.y);
                    } else {
                        ctx.drawImage(this.image, this.x, this.y, this.width, this.height);
                    }
                }
            }
            function updateScreen() {
                screen.frameno += 1
                screen.clear()
                if (screen.keys && screen.keys[37]) {
                  player.x += -1;
                  player.image.src = "https://lh5.googleusercontent.com/o2P-71VwZCE_hNGgKu2W-g4oh3DF4gdcNNJWfsPpC5y0EnSMTmZOujWbgSPjKXFirSsjWnigRnbO_YgruFrjnolWYPNsf-2l7oTYKzaYXCeIaXjUDAhIJtzDrFNHoRGvbJwAQ0Bruu5LYhShE_8B4w"
                }
                if (screen.keys && screen.keys[39]) {
                  player.x += 1;
                  player.image.src = "https://lh3.googleusercontent.com/eRJyL2YS9mEHtA_wK4X0kDIcRob1uueMmX3TzuaOPQlkJTBg17_ghg2WqBB42ytMRLXWIRGmsAzz6w7Bfo9OKxXCsvPxs0PlkIOWgy0CUPwwBYFIstdgtoR_kwRVpoBQnJJv0eWLPK2Y-TsA21IejA"
                }
                if (screen.keys && screen.keys[38]) {
                    if (player.y == screen.canvas.height - 44) {player.y -= 61}
                }
                player.y += 1
                if (player.y > screen.canvas.height - 44) {player.y = screen.canvas.height - 44
                } if (player.x < -15) {player.x = -15
                } if (player.x > screen.canvas.width - 35) {player.x = screen.canvas.width - 35}
                score.text = "SCORE: " + screen.frameno;
                obstacles.push(new component(20, 15, "https://lh3.googleusercontent.com/shs5LjDPd-Ruejm7klLPxkoOXUAp72NZ-MYg549c0xNZvLXzQPvwfCd1cPo8-nD5c-TqaJFJEWLxQVkmMBkIscrx0-zzAkyDvv7_WOtW7K3nktsrCniEClRY_LoPcRCt-oWV7XARnlaW1MAOoSqS", screen.canvas.width - 15, screen.canvas.height - 14, "image"));
                for (i = 0; i < obstacles.length; i += 1) {
                  obstacles[i].x -= 1;
                  obstacles[i].update();
                  //if (obstacles[i].x < player.x + 30 || obsatcles[i].x + player)
                }
                score.update();
                player.update();
                //const date = Date.now();
                //let currentdate = 0;
                //do {currentdate = Date.now();
                //} while (currentdate - date < 500);
                //player.image.src = "https://lh3.googleusercontent.com/5YqqKa3wqS4JjhVHtnndMb1bNzOqUysKZQrC-BR3AfSnOsn3eB5ERupPXRv25efdKpG_Gp9wl9wiZCoFZoVrQ6c-gT_No-x6MEnvghwY0wSXtf2ZttNd711ed6bzqjegN0JYpnoz-UIrm8JrUGalww"
            }
        </script>
    </body>
</html>
