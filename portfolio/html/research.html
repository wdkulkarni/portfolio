<!DOCTYPE html>

<html lang='en'>
  <head>
    <title>Research!</title>
  </head>
  <body onload='start()'>
    <style>
      branch {
        line-height: 40px;
        padding: 10px 40px;
        background: #ff0000;
        border: none;
      }
      .output {
        display: inline-block;
        overflow: auto;
        height: 250px;
        border: 1px black solid;
        padding: 2%;
        width: 617px;
        margin: 0 auto;
        white-space: nowrap;
        font-size: large;
      }
      branch:hover {background: #ff6060;}
    </style>
    <h1>Research!</h1>
    <script>
      function start() {
        world = new World();
        timeout = setInterval(world.tick, 10);
        for (let i = 0; i < world.science.length; i++) {
          var branch = document.createElement('branch');
          branch.innerHTML = world.science[i].name;
          branch.addEventListener('click', function() {
            world.resources = world.science[i].invent(world.resources);
          });
          document.body.insertBefore(branch, document.body.childNodes[4]);
          var p = document.createElement('p');
          p.innerHTML = '|';
          p.style.display = 'inline-block';
          document.body.insertBefore(p, document.body.childNodes[4]);
        }
      };
      function Branch(name, effect) {
        this.name = name;
        this.effect = effect;
        this.strength = 1;
        this.researched = false;
        this.research = function(resources) {
          var c = 0;
          for (let i = 0; i < resources.length; i++) {
            if (!(resources[i] - 1000 < 0) || resources[i] == -1) {
              c++;
            }
          }
          if (c == resources.length) {
            for (let i = 0; i < resources.length; i++) {
              if (resources[i] != -1) {
                resources[i] -= 1000;
              }
            }
            this.researched = true;
            print(`You researched ${this.name}!`);
          } else {
            print(`You do not have enough resources to research ${this.name}. You need 1000
             of every discovered resource.`);
          }
          return resources;
        }
        this.invent = function(resources) {
          if (this.researched == false) {return this.research(resources);}
          var needs = [2, 0, randint(0, resources.length - 1)];
          if (!(resources[needs[0]] - this.strength * 100 < 0) && !(resources[needs[1]] - this.strength * 100 < 0) && !(resources[needs[2]] - this.strength * 100 < 0)) {
            resources[needs[0]] -= this.strength * 100;
            resources[needs[1]] -= this.strength * 100
            resources[needs[2]] -= this.strength * 100
            this.strength++
            print('You invented something new!');
          } else {
            print(`You need ${this.strength * 100} of ${world.resource_names[needs[0]]}, ${world.resource_names[needs[1]]}, and ${world.resource_names[needs[2]]}`);
          }
          return resources;
        }
      };
      function Event(name, constraints, effect) {
        this.name = name;
        this.constraints = constraints;
        this.effect = effect;
        this.occur = function() {
          if (this.constraints) {this.effect();}
        }
      };
      function World() {
        this.events = [new Event('start', world.resources[0] == -1, function(resources) {
                         print('Welcome to the game. Click buttons to research stuff, and click them again to invent stuff to increase production.');
                       }),
                       new Event('')];
        this.science = [new Branch('mining', function(resources, strength) {
                          resources[0] += strength;
                          return [resources, strength];
                        }),
                        new Branch('building', function(resources, strength) {
                          resources[0] -= (strength / 2);
                          resources[1] += strength;
                          return [resources, strength];
                        }),
                        new Branch('engineering', function(resources, strength) {
                          resources[0] -= (strength / 3);
                          resources[2] += strength;
                          return [resources, strength];
                        }),
                        new Branch('defense', function(resources, strength) {
                          resources[2] -= (strength / 10);
                          resources[1] -= (strength / 5);
                          resources[3] += strength;
                          return [resources, strength];
                        }),
                        new Branch('manufacturing', function(resources, strength) {
                          resources[2] -= (strength / 10);
                          resources[4] += strength;
                          return [resources, strength];
                        }),
                        new Branch('biology', function(resources, strength) {
                          resources[5] += strength;
                          resources[1] -= (strength / 10);
                          return [resources, strength];
                        }),
                        new Branch('astronomy', function(resources, strength) {
                          resources[6] += strength;
                          resources[2] -= (strength / 10);
                          resources[1] -= (strength / 10);
                          return [resources, strength];
                        }),
                        new Branch('zoology', function(resources, strength) {
                          resources[7] += strength;
                          resources[5] -= (strength / 10);
                          return [resources, strength];
                        }),
                        new Branch('geology', function(resources, strength) {
                          resources[0] += strength;
                          resources[2] -= (strength / 20);
                          return [resources, strength];
                        }),
                        new Branch('chemistry', function(resources, strength) {
                          resources[8] += strength;
                          resources[2] -= (strength / 20);
                          resources[7] -= (strength / 10);
                          return [resources, strength];
                        }),
                        new Branch('coding', function(resources, strength) {
                          resources[2] += strength;
                          resources[0] -= (strength / 20);
                          resources[1] -= (strength / 20);
                          resources[3] -= (strength / 20);
                          resources[4] -= (strength / 20);
                          resources[5] -= (strength / 20);
                          resources[6] -= (strength / 20);
                          resources[7] -= (strength / 20);
                          resources[8] -= (strength / 20);
                          return [resources, strength];
                        })];
        this.science.reverse();
        this.resource_names = ['ore', 'people', 'tech', 'safety', 'goods', 'health', 'space', 'animals', 'chemicals'];
        this.resources = [];
        for (let i = 0; i < 9; i++) {this.resources.push(-1);}
        this.ticks = 0
        this.tick = function() {
          world.ticks++;
          for (let i = 0; i < world.science.length; i++) {
            if (world.science[i].researched == true) {
              [world.resources, world.science[i].strength] = world.science[i].effect(world.resources, world.science[i].strength);
            }
          }
          for (let i = 0; i < world.events.length; i++) {world.events[i].occur();}
          stts = document.getElementById('stats');
          stts.innerHTML = '';
          for(let i = 0; i < world.resources.length; i++) {
            if (world.resources[i] != -1) {
              stts.innerHTML += world.resource_names[i] + ': ' + world.resources[i] + '<br>';
            }
          }
        }
      };
      function print(...value) {
        for (let i = 0; i < value.length; i++) {String(value[i]);}
        value = value.join(' ');
        div = document.getElementById('output');
        p = document.createElement('p');
        p.innerHTML = value;
        div.appendChild(p);
        p.scrollIntoView();
      };
      const randint = (min, max) => (Math.floor(Math.random() * (max - min + 1)) + min);
    </script>
    <p></p>
    <div id='output' class='output'></div>
    <p id='stats' class='output'></p>
  </body>
</html>
